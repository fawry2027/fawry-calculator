<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fawry MSME | حاسبة الأقساط والزيارات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #0b6b3a;
      --primary-dark: #074c29;
      --primary-light: #e8f5ee;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 18px 12px 32px;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .role-pill {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }

    .card-header .credit {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .card-body {
      padding: 18px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    .row-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      min-height: 20px;
    }

    .status-ok {
      color: var(--primary);
    }

    .status-err {
      color: var(--danger);
    }

    .visits-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .visit-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #f8fafc;
    }

    .visit-item {
      margin-bottom: 6px;
      font-size: 14px;
    }

    .visit-label {
      font-weight: 700;
      color: var(--primary-dark);
    }

    .visit-photo {
      display: block;
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid var(--border);
      object-fit: contain;
      background: #fff;
    }

    .visit-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .calc-box {
      background: var(--primary-light);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 560px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="card">
      <div class="card-header">
        <div class="credit">تصميم وإعداد: Galal Ali</div>
        <h2>تسجيل الدخول</h2>
        <p style="font-size:13px; opacity:0.9;">أدخل رقم الموبايل وكلمة المرور للوصول للنظام</p>
      </div>
      <div class="card-body">
        <form id="loginForm">
          <div class="form-group">
            <label for="loginPhone">رقم الموبايل</label>
            <input type="tel" id="loginPhone" placeholder="01xxxxxxxxx" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary">دخول</button>
          <div id="loginStatus" class="status-msg status-err"></div>
        </form>
      </div>
    </div>

    <!-- التطبيق بعد الدخول -->
    <div id="appSection" class="hidden">
      <div class="topbar">
        <div class="user-badge">
          <span id="currentUserName">مستخدم</span>
          <span id="currentUserRole" class="role-pill">موظف</span>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-secondary">تسجيل خروج</button>
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="visitsTab">📍 الزيارات</button>
        <button type="button" class="tab-btn" data-tab="calcTab">▦ الحاسبة</button>
        <button type="button" id="employeesTabBtn" class="tab-btn hidden" data-tab="employeesTab">👥 الموظفون</button>
      </div>

      <!-- تبويب الزيارات -->
      <div id="visitsTab">
        <div class="card">
          <div class="card-header">
            <div class="credit">تصميم وإعداد: Galal Ali</div>
            <h2>إدارة الزيارات</h2>
            <p style="font-size:13px; opacity:0.9;">تسجيل ومتابعة زيارات العملاء مع صورة الزيارة</p>
          </div>
          <div class="card-body">
            <div class="row-actions">
              <button type="button" id="clearFormBtn" class="btn btn-secondary">مسح البيانات</button>
              <button type="button" id="exportExcelBtn" class="btn btn-secondary">تصدير Excel</button>
            </div>

            <form id="visitForm">
              <div class="form-group">
                <label for="clientName">اسم العميل</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل" required>
              </div>

              <div class="form-group">
                <label for="clientPhone">رقم العميل</label>
                <input type="tel" id="clientPhone" placeholder="01xxxxxxxxx" required>
              </div>

              <div class="form-group">
                <label for="region">المحافظة / المنطقة</label>
                <input type="text" id="region" placeholder="مثال: المنيا - ملوي">
              </div>

              <div class="form-group">
                <label for="visitDate">تاريخ الزيارة</label>
                <input type="date" id="visitDate" required>
              </div>

              <div class="form-group">
                <label for="activityType">نوع النشاط</label>
                <input type="text" id="activityType" placeholder="مثال: تجارة مواد غذائية، ملابس، صيدلية..." required>
              </div>

              <div class="form-group">
                <label for="visitResult">نتيجة الزيارة</label>
                <select id="visitResult" required>
                  <option value="">اختر نتيجة الزيارة</option>
                  <option value="مهتم بالتمويل">مهتم بالتمويل</option>
                  <option value="جاري استكمال المستندات">جاري استكمال المستندات</option>
                  <option value="تم التعاقد">تم التعاقد</option>
                  <option value="غير مهتم حالياً">غير مهتم حالياً</option>
                  <option value="إعادة متابعة">إعادة متابعة</option>
                </select>
              </div>

              <div class="form-group">
                <label for="visitPhoto">صورة الزيارة (اختياري)</label>
                <input type="file" id="visitPhoto" accept="image/*">
              </div>

              <button type="submit" id="saveVisitBtn" class="btn btn-primary">حفظ الزيارة</button>
              <div id="visitStatus" class="status-msg"></div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h3 style="margin-bottom:10px;">سجل الزيارات (<span id="visitsCount">0</span>)</h3>

            <div class="filters">
              <input type="text" id="filterSearch" placeholder="بحث باسم العميل أو الرقم أو النشاط...">
              <select id="filterResult">
                <option value="">كل النتائج</option>
                <option value="مهتم بالتمويل">مهتم بالتمويل</option>
                <option value="جاري استكمال المستندات">جاري استكمال المستندات</option>
                <option value="تم التعاقد">تم التعاقد</option>
                <option value="غير مهتم حالياً">غير مهتم حالياً</option>
                <option value="إعادة متابعة">إعادة متابعة</option>
              </select>
              <select id="filterEmployee" class="hidden">
                <option value="">كل الموظفين</option>
              </select>
            </div>

            <div id="visitsContainer" class="visits-list"></div>
          </div>
        </div>
      </div>

      <!-- تبويب الحاسبة -->
      <div id="calcTab" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>حاسبة الأقساط</h2>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label for="loanAmount">قيمة التمويل (جنيه)</label>
              <input type="number" id="loanAmount" placeholder="مثال: 50000" min="1">
            </div>
            <div class="form-group">
              <label for="loanMonths">المدة (بالأشهر)</label>
              <input type="number" id="loanMonths" placeholder="مثال: 12" min="1">
            </div>
            <div class="form-group">
              <label for="annualRate">معدل الفائدة السنوي (%)</label>
              <input type="number" id="annualRate" placeholder="مثال: 24" step="0.1" min="0">
            </div>
            <button type="button" id="calcBtn" class="btn btn-primary">احسب القسط</button>
            <div id="calcResult" class="calc-box hidden"></div>
          </div>
        </div>
      </div>

      <!-- تبويب الموظفون -->
      <div id="employeesTab" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>إدارة الموظفين</h2>
          </div>
          <div class="card-body">
            <form id="createEmployeeForm">
              <div class="form-group">
                <label for="empName">اسم الموظف</label>
                <input type="text" id="empName" placeholder="الاسم الكامل" required>
              </div>
              <div class="form-group">
                <label for="empPhone">رقم الموبايل (11 رقماً)</label>
                <input type="tel" id="empPhone" placeholder="01xxxxxxxxx" maxlength="11" required>
              </div>
              <div class="form-group">
                <label for="empPassword">كلمة المرور</label>
                <input type="password" id="empPassword" placeholder="6 أحرف أو أرقام فأكثر" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-primary">إنشاء حساب الموظف</button>
              <div id="empStatus" class="status-msg"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const PHOTO_BUCKET = 'visit-photos';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let allVisits = [];

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizePhone(phone = '') {
      return phone.replace(/[^0-9]/g, '');
    }

    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('visitDate').value = today;
    }

    setTodayDate();

    // التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const targetId = btn.dataset.tab;
        ['visitsTab', 'calcTab', 'employeesTab'].forEach(id => {
          document.getElementById(id).classList.toggle('hidden', id !== targetId);
        });
      });
    });

    // تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('loginStatus');
      statusEl.textContent = '';

      const cleanPhone = normalizePhone(document.getElementById('loginPhone').value);
      const password = document.getElementById('loginPassword').value;

      if (cleanPhone.length < 11) {
        statusEl.textContent = 'أدخل رقم موبايل صحيحاً من 11 رقماً';
        return;
      }

      const email = `${cleanPhone}@team.local`;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        statusEl.textContent = 'رقم الموبايل أو كلمة المرور غير صحيحة';
        return;
      }

      await initSession(data.user);
    });

    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    });

    async function initSession(user) {
      currentUser = user;
      const { data: profile } = await sb
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single();

      currentProfile = profile || {
        id: user.id,
        full_name: user.email,
        role: 'employee'
      };

      document.getElementById('currentUserName').textContent = currentProfile.full_name || 'مستخدم';
      const isManager = currentProfile.role === 'manager';
      document.getElementById('currentUserRole').textContent = isManager ? 'مدير' : 'موظف';
      document.getElementById('employeesTabBtn').classList.toggle('hidden', !isManager);
      document.getElementById('filterEmployee').classList.toggle('hidden', !isManager);

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');

      await loadVisits();
    }

    // مسح النموذج
    document.getElementById('clearFormBtn').addEventListener('click', () => {
      document.getElementById('visitForm').reset();
      setTodayDate();
      document.getElementById('visitStatus').textContent = '';
    });

    // حفظ زيارة
    document.getElementById('visitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('visitStatus');
      const saveBtn = document.getElementById('saveVisitBtn');
      statusEl.textContent = '';
      statusEl.className = 'status-msg';

      const clientName = document.getElementById('clientName').value.trim();
      const clientPhone = normalizePhone(document.getElementById('clientPhone').value);
      const region = document.getElementById('region').value.trim();
      const visitDate = document.getElementById('visitDate').value;
      const activityType = document.getElementById('activityType').value.trim();
      const visitResult = document.getElementById('visitResult').value;
      const photoFile = document.getElementById('visitPhoto').files[0];

      if (!clientName || !clientPhone || !visitDate || !activityType || !visitResult) {
        statusEl.textContent = 'يرجى استكمال جميع الحقول المطلوبة';
        statusEl.classList.add('status-err');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'جاري الحفظ...';

      let photoUrl = null;

      try {
        if (photoFile) {
          const ext = photoFile.name.split('.').pop() || 'jpg';
          const filePath = `${currentUser.id}/${Date.now()}.${ext}`;
          const { error: uploadError } = await sb.storage
            .from(PHOTO_BUCKET)
            .upload(filePath, photoFile, { upsert: false });

          if (uploadError) throw uploadError;

          const { data: pubData } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(filePath);
          photoUrl = pubData.publicUrl;
        }

        const payload = {
          user_id: currentUser.id,
          employee_name: currentProfile.full_name || currentUser.email,
          client_name: clientName,
          client_phone: clientPhone,
          region: region || null,
          visit_date: visitDate,
          activity_type: activityType,
          visit_result: visitResult,
          photo_url: photoUrl
        };

        const { error: insertError } = await sb.from('visits').insert([payload]);
        if (insertError) throw insertError;

        document.getElementById('visitForm').reset();
        setTodayDate();
        statusEl.textContent = 'تم حفظ الزيارة بنجاح';
        statusEl.classList.add('status-ok');

        await loadVisits();
      } catch (err) {
        statusEl.textContent = `تعذر حفظ الزيارة: ${err.message || err}`;
        statusEl.classList.add('status-err');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ الزيارة';
      }
    });

    // تحميل الزيارات
    async function loadVisits() {
      const { data, error } = await sb
        .from('visits')
        .select('*')
        .order('visit_date', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('visitsContainer').innerHTML =
          `<div class="status-msg status-err">تعذر تحميل الزيارات: ${escapeHTML(error.message)}</div>`;
        return;
      }

      allVisits = data || [];
      populateEmployeeFilter();
      renderVisits();
    }

    function populateEmployeeFilter() {
      const select = document.getElementById('filterEmployee');
      const currentVal = select.value;
      const names = [...new Set(allVisits.map(v => v.employee_name).filter(Boolean))];
      select.innerHTML = '<option value="">كل الموظفين</option>' +
        names.map(n => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join('');
      select.value = currentVal;
    }

    function getFilteredVisits() {
      const q = document.getElementById('filterSearch').value.trim().toLowerCase();
      const resFilter = document.getElementById('filterResult').value;
      const empFilter = document.getElementById('filterEmployee').value;

      return allVisits.filter(v => {
        if (resFilter && v.visit_result !== resFilter) return false;
        if (empFilter && v.employee_name !== empFilter) return false;
        if (q) {
          const hay = `${v.client_name || ''} ${v.client_phone || ''} ${v.activity_type || ''} ${v.region || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    // عرض الكارت بالترتيب المطلوب فقط:
    // 1. اسم العميل
    // 2. تاريخ الزيارة
    // 3. رقم العميل
    // 4. نوع النشاط
    // 5. نتيجة الزيارة
    // 6. الصورة
    function renderVisits() {
      const filtered = getFilteredVisits();
      document.getElementById('visitsCount').textContent = filtered.length;
      const container = document.getElementById('visitsContainer');

      if (!filtered.length) {
        container.innerHTML = '<p style="color:var(--muted); text-align:center; padding:16px;">لا توجد زيارات مطابقة</p>';
        return;
      }

      const isManager = currentProfile?.role === 'manager';

      container.innerHTML = filtered.map(v => {
        const canDelete = isManager || v.user_id === currentUser?.id;

        return `
          <div class="visit-card">
            <div class="visit-item"><span class="visit-label">اسم العميل:</span> ${escapeHTML(v.client_name || 'غير محدد')}</div>
            <div class="visit-item"><span class="visit-label">تاريخ الزيارة:</span> ${escapeHTML(v.visit_date || 'غير محدد')}</div>
            <div class="visit-item"><span class="visit-label">رقم العميل:</span> ${escapeHTML(v.client_phone || 'غير مسجل')}</div>
            <div class="visit-item"><span class="visit-label">نوع النشاط:</span> ${escapeHTML(v.activity_type || 'غير محدد')}</div>
            <div class="visit-item"><span class="visit-label">نتيجة الزيارة:</span> ${escapeHTML(v.visit_result || 'غير محددة')}</div>
            ${v.photo_url ? `<img src="${escapeHTML(v.photo_url)}" alt="صورة الزيارة" class="visit-photo">` : ''}
            ${canDelete ? `
              <div class="visit-actions">
                <button type="button" class="btn-danger" onclick="deleteVisit('${v.id}')">حذف</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function deleteVisit(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الزيارة؟')) return;
      const { error } = await sb.from('visits').delete().eq('id', id);
      if (!error) {
        await loadVisits();
      }
    }

    ['filterSearch', 'filterResult', 'filterEmployee'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderVisits);
      document.getElementById(id).addEventListener('change', renderVisits);
    });

    // تصدير Excel
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
      const rows = getFilteredVisits().map(v => ({
        'اسم العميل': v.client_name || '',
        'تاريخ الزيارة': v.visit_date || '',
        'رقم العميل': v.client_phone || '',
        'نوع النشاط': v.activity_type || '',
        'نتيجة الزيارة': v.visit_result || '',
        'المحافظة / المنطقة': v.region || '',
        'الموظف': v.employee_name || '',
        'رابط الصورة': v.photo_url || ''
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'الزيارات');
      XLSX.writeFile(wb, `visits_${new Date().toISOString().split('T')[0]}.xlsx`);
    });

    // حاسبة الأقساط
    document.getElementById('calcBtn').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('loanAmount').value);
      const months = parseInt(document.getElementById('loanMonths').value, 10);
      const rate = parseFloat(document.getElementById('annualRate').value) || 0;
      const resBox = document.getElementById('calcResult');

      if (!amount || !months || amount <= 0 || months <= 0) {
        resBox.textContent = 'أدخل قيمة تمويل ومدة صحيحة بالأشهر';
        resBox.classList.remove('hidden');
        return;
      }

      const monthlyRate = (rate / 100) / 12;
      const installment = monthlyRate > 0
        ? (amount * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -months))
        : amount / months;

      const totalPayment = installment * months;
      resBox.innerHTML = `
        <div>القسط الشهري التقريبي: ${installment.toFixed(2)} جنيه</div>
        <div>إجمالي السداد: ${totalPayment.toFixed(2)} جنيه</div>
      `;
      resBox.classList.remove('hidden');
    });

    // إنشاء حساب موظف
    document.getElementById('createEmployeeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('empStatus');
      statusEl.textContent = '';
      statusEl.className = 'status-msg';

      const fullName = document.getElementById('empName').value.trim();
      const phone = normalizePhone(document.getElementById('empPhone').value);
      const password = document.getElementById('empPassword').value;

      const { error } = await sb.rpc('admin_create_employee', {
        p_full_name: fullName,
        p_phone: phone,
        p_password: password
      });

      if (error) {
        statusEl.textContent = `تعذر إنشاء الحساب: ${error.message}`;
        statusEl.classList.add('status-err');
        return;
      }

      document.getElementById('createEmployeeForm').reset();
      statusEl.textContent = 'تم إنشاء حساب الموظف بنجاح';
      statusEl.classList.add('status-ok');
    });

    // التحقق من الجلسة الحالية عند الفتح
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        await initSession(session.user);
      }
    })();
  </script>
</body>
</html>
