
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حاسبة القسط الشهري | جلال علي</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    line-height: 1.5;
}

.app-wrapper {
    width: 100%;
    max-width: 460px;
}

.calculator-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(15,23,42,.08);
    overflow: hidden;
    border: 1px solid #e2e8f0;
}

.card-header {
    background: linear-gradient(135deg,#065f46,#047857);
    color: white;
    padding: 22px;
    text-align: center;
}

.top-signature {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #ecfdf5;
    font-weight: 600;
}

.top-signature-name {
    font-weight: 800;
    direction: ltr;
    color: white;
}

.card-header h1 {
    font-size: 23px;
    font-weight: 800;
    margin-bottom: 4px;
}

.card-header p {
    font-size: 13px;
    color: #d1fae5;
}

.card-body {
    padding: 22px 20px 24px;
}

.section-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 18px;
    border-bottom: 1px solid #f1f5f9;
}

.section-title {
    font-size: 16px;
    font-weight: 700;
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #059669;
}

.reset-btn {
    background: #f8fafc;
    color: #475569;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
}

.reset-btn:hover {
    background: #ecfdf5;
    color: #065f46;
}

.form-group {
    margin-bottom: 22px;
}

.label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.input-label {
    font-size: 15px;
    font-weight: 700;
    color: #334155;
}

.range-hint {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    background: #f1f5f9;
    padding: 4px 9px;
    border-radius: 8px;
    direction: ltr;
}

.amount-input-box {
    position: relative;
    display: flex;
    align-items: center;
}

.amount-input {
    width: 100%;
    height: 58px;
    padding: 12px 16px 12px 65px;
    font-size: 26px;
    font-weight: 800;
    font-family: inherit;
    color: #0f172a;
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    text-align: right;
    direction: ltr;
    outline: none;
}

.amount-input:focus {
    background: white;
    border-color: #059669;
    box-shadow: 0 0 0 4px rgba(5,150,105,.12);
}

.amount-input.has-error {
    border-color: #e11d48;
    background: #fff1f2;
}

.currency-badge {
    position: absolute;
    left: 14px;
    font-size: 14px;
    font-weight: 700;
    color: #059669;
    background: #ecfdf5;
    padding: 4px 10px;
    border-radius: 8px;
}

.error-banner {
    display: none;
    margin-top: 10px;
    padding: 10px;
    background: #fff1f2;
    border: 1px solid #fecdd3;
    border-radius: 12px;
    color: #be123c;
    font-size: 12px;
    font-weight: 700;
}

.error-banner.visible {
    display: block;
}

.slider-container {
    margin-top: 20px;
}

.custom-slider {
    appearance: none;
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
}

.custom-slider::-webkit-slider-thumb {
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #059669;
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(5,150,105,.45);
}

.custom-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #059669;
    border: 3px solid white;
}

.quick-marks {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-top: 10px;
    gap: 4px;
}

.quick-mark-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    padding: 5px;
    border-radius: 6px;
    cursor: pointer;
}

.quick-mark-btn:hover {
    color: #065f46;
    background: #ecfdf5;
}

.duration-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-top: 10px;
}

.duration-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
}

.duration-btn .months-num {
    font-size: 23px;
    font-weight: 800;
    color: #334155;
}

.duration-btn .months-text {
    font-size: 13px;
    font-weight: 700;
    color: #64748b;
}

.duration-btn.active {
    background: #ecfdf5;
    border-color: #059669;
    box-shadow: 0 4px 12px rgba(5,150,105,.14);
}

.duration-btn.active .months-num {
    color: #065f46;
}

.duration-btn.active .months-text {
    color: #047857;
}

.interest-info {
    margin-top: 18px;
    padding: 11px 13px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}

.interest-value {
    color: #047857;
    font-weight: 800;
    direction: ltr;
}

.result-box {
    margin-top: 22px;
    background: #ecfdf5;
    border: 2px solid #a7f3d0;
    border-radius: 20px;
    padding: 20px 14px;
    text-align: center;
}

.result-label {
    font-size: 15px;
    font-weight: 700;
    color: #047857;
    margin-bottom: 6px;
}

.result-value-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
}

.result-amount {
    font-size: 34px;
    font-weight: 900;
    color: #065f46;
    direction: ltr;
    letter-spacing: -.5px;
}

.result-unit {
    font-size: 14px;
    font-weight: 800;
    color: #059669;
}

.footer-note {
    text-align: center;
    font-size: 10px;
    color: #94a3b8;
    margin-top: 15px;
}

@media(max-width:360px) {
    .result-amount {
        font-size: 29px;
    }
    .card-body {
        padding: 18px 14px;
    }
}
</style>
</head>

<body>

<div class="app-wrapper">
<main class="calculator-card">

<header class="card-header">
    <div class="top-signature">
        <span>تصميم وإعداد:</span>
        <span class="top-signature-name">Galal Ali</span>
    </div>
    <h1>حاسبة القسط الشهري</h1>
    <p>حساب فوري بنظام الفائدة المتناقصة</p>
</header>

<div class="card-body">

<div class="section-top-bar">
    <h2 class="section-title">
        <span class="section-title-dot"></span>
        بيانات التمويل المطلوب
    </h2>
    <button type="button" id="resetBtn" class="reset-btn">إعادة ضبط</button>
</div>

<div class="form-group">

<div class="label-row">
    <label for="amountInput" class="input-label">مبلغ التمويل</label>
    <span class="range-hint">350,000 - 2,000,000</span>
</div>

<div class="amount-input-box">
    <input type="text" id="amountInput" class="amount-input"
    inputmode="numeric" value="500,000" autocomplete="off">
    <span class="currency-badge">ج.م</span>
</div>

<div id="validationError" class="error-banner" role="alert">
    <span id="validationText"></span>
</div>

<div class="slider-container">
    <input type="range" id="amountSlider" class="custom-slider"
    min="350000" max="2000000" step="50000" value="500000">

    <div class="quick-marks">
        <button class="quick-mark-btn" data-amount="350000">350 ألف</button>
        <button class="quick-mark-btn" data-amount="500000">500 ألف</button>
        <button class="quick-mark-btn" data-amount="1000000">1 مليون</button>
        <button class="quick-mark-btn" data-amount="1500000">1.5 مليون</button>
        <button class="quick-mark-btn" data-amount="2000000">2 مليون</button>
    </div>
</div>
</div>

<div class="form-group" style="margin-bottom:0">
<label class="input-label">مدة السداد</label>

<div class="duration-grid" id="durationGroup">
    <button type="button" class="duration-btn active" data-months="12">
        <span class="months-num">12</span>
        <span class="months-text">شهر</span>
    </button>

    <button type="button" class="duration-btn" data-months="18">
        <span class="months-num">18</span>
        <span class="months-text">شهر</span>
    </button>

    <button type="button" class="duration-btn" data-months="24">
        <span class="months-num">24</span>
        <span class="months-text">شهر</span>
    </button>
</div>
</div>

<div class="interest-info">
    <span>الفائدة السنوية المتناقصة</span>
    <span id="interestDisplay" class="interest-value">42%</span>
</div>

<div class="result-box">
    <div class="result-label">القسط الشهري</div>
    <div class="result-value-row">
        <span id="monthlyInstallmentDisplay" class="result-amount">51,741.98</span>
        <span class="result-unit">جنيه / شهرياً</span>
    </div>
</div>

<div class="footer-note">
    تصميم وإعداد Galal Ali
</div>

</div>
</main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const MIN_AMOUNT = 350000;
    const MAX_AMOUNT = 2000000;
    const DEFAULT_AMOUNT = 500000;
    const DEFAULT_MONTHS = 12;

    let currentAmount = DEFAULT_AMOUNT;
    let currentMonths = DEFAULT_MONTHS;

    const amountInput = document.getElementById('amountInput');
    const amountSlider = document.getElementById('amountSlider');
    const validationError = document.getElementById('validationError');
    const validationText = document.getElementById('validationText');
    const durationBtns = document.querySelectorAll('.duration-btn');
    const quickMarkBtns = document.querySelectorAll('.quick-mark-btn');
    const resetBtn = document.getElementById('resetBtn');
    const monthlyDisplay = document.getElementById('monthlyInstallmentDisplay');
    const interestDisplay = document.getElementById('interestDisplay');

    function formatCurrency(num) {
        return Number(num).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function formatInteger(num) {
        return Math.round(num).toLocaleString('en-US');
    }

    function getAnnualInterestRate(amount) {
        if (amount <= 500000) {
            return 0.42;
        } else if (amount <= 1000000) {
            return 0.41;
        } else {
            return 0.40;
        }
    }

    function calculateAndRender() {

        if (isNaN(currentAmount) || currentAmount < MIN_AMOUNT) {
            validationText.textContent =
                'الحد الأدنى للتمويل 350,000 جنيه مصري';
            validationError.classList.add('visible');
            amountInput.classList.add('has-error');
        } else if (currentAmount > MAX_AMOUNT) {
            validationText.textContent =
                'الحد الأقصى للتمويل 2,000,000 جنيه مصري';
            validationError.classList.add('visible');
            amountInput.classList.add('has-error');
        } else {
            validationError.classList.remove('visible');
            amountInput.classList.remove('has-error');
        }

        const P = Math.min(
            Math.max(isNaN(currentAmount) ? MIN_AMOUNT : currentAmount, MIN_AMOUNT),
            MAX_AMOUNT
        );

        const annualRate = getAnnualInterestRate(P);
        const r = annualRate / 12;
        const n = currentMonths;

        const factor = Math.pow(1 + r, n);
        const installment = P * (r * factor) / (factor - 1);

        monthlyDisplay.textContent = formatCurrency(installment);
        interestDisplay.textContent = (annualRate * 100) + '%';
    }

    function updateAmount(value) {
        currentAmount = Number(value);
        amountInput.value = formatInteger(currentAmount);
        amountSlider.value = currentAmount;
        calculateAndRender();
    }

    amountInput.addEventListener('input', (e) => {

        const normalized = e.target.value
            .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
            .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

        const rawDigits = normalized.replace(/[^\d]/g, '');

        if (rawDigits === '') {
            currentAmount = NaN;
            e.target.value = '';
            calculateAndRender();
            return;
        }

        currentAmount = parseInt(rawDigits, 10);
        e.target.value = formatInteger(currentAmount);

        amountSlider.value = Math.min(
            Math.max(currentAmount, MIN_AMOUNT),
            MAX_AMOUNT
        );

        calculateAndRender();
    });

    amountInput.addEventListener('blur', () => {
        if (isNaN(currentAmount) || currentAmount < MIN_AMOUNT) {
            currentAmount = MIN_AMOUNT;
        } else if (currentAmount > MAX_AMOUNT) {
            currentAmount = MAX_AMOUNT;
        }

        updateAmount(currentAmount);
    });

    amountSlider.addEventListener('input', (e) => {
        updateAmount(e.target.value);
    });

    quickMarkBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            updateAmount(btn.dataset.amount);
        });
    });

    durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {

            durationBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentMonths = Number(btn.dataset.months);
            calculateAndRender();
        });
    });

    resetBtn.addEventListener('click', () => {

        currentAmount = DEFAULT_AMOUNT;
        currentMonths = DEFAULT_MONTHS;

        amountInput.value = formatInteger(DEFAULT_AMOUNT);
        amountSlider.value = DEFAULT_AMOUNT;

        durationBtns.forEach(b => b.classList.remove('active'));
        durationBtns[0].classList.add('active');

        calculateAndRender();
    });

    calculateAndRender();

});
</script>

</body>
</html>
